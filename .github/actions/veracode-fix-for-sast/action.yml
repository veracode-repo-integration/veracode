name: 'Veracode Fix for SAST'
description: 'Automatically fix SAST vulnerabilities using Veracode CLI'
inputs:
  github-token:
    description: 'GitHub token for PR creation and comments'
    required: true
  pr-number:
    description: 'Original PR number to post comment on'
    required: true
  sast-scan-run-id:
    description: 'Workflow run ID containing SAST scan results'
    required: true
  sast-scan-artifact-id:
    description: 'Artifact ID of SAST scan results'
    required: true
  repository:
    description: 'Repository in owner/repo format'
    required: true
  branch:
    description: 'Branch to create fix PR against'
    required: true
  fix-sast-params:
    description: 'SAST Fix IDs to fix (e.g., "SAST-*" or "SAST-123,SAST-456")'
    required: true
  github-api-url:
    description: 'GitHub API URL'
    required: false
    default: 'https://api.github.com'
runs:
  using: 'node20'
  main: 'dist/index.js'
